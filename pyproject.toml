[project]
name = "club-penguin-bot"
version = "0.1.0"
description = "Simple Club Penguin Journey bot experiments"
authors = [
    {name = "Kyle Hurd",email = "kmdude1000@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.53.0,<2.0.0",
    "validators (>=0.35.0,<0.36.0)",
    "opencv-python (>=4.13.0.92,<5.0.0.0)",
    "numpy (>=2.4.6,<3.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "pytesseract (>=0.3.13,<0.4.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "club_penguin_bot", from = "src" }]
