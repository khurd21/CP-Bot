[project]
name = "club-penguin-bot"
version = "0.1.0"
description = "Simple Club Penguin Journey bot experiments"
authors = [
    {name = "Kyle Hurd",email = "kmdude1000@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.53.0,<2.0.0",
    "validators (>=0.35.0,<0.36.0)",
    "opencv-python (>=4.13.0.92,<5.0.0.0)",
    "numpy (>=2.4.6,<3.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "pytesseract (>=0.3.13,<0.4.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "club_penguin_bot", from = "src" }]

[project.scripts]
cpb-pizza-oven = "club_penguin_bot.actions.pizza_oven_game_action:main"
cpb-order = "club_penguin_bot.actions.order_action:main"
cpb-throw-snowball = "club_penguin_bot.actions.throw_snowball_at_clock_action:main"

[tool.black]
line-length = 300
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "pylint (>=4.0.5,<5.0.0)",
    "pytest (>=8.3.2,<9.0.0)"
]
